
<header>
  <h1>Player Management System</h1>

  <nav>
    <a routerLink="/players">Players</a> |

    <a routerLink="/players/add">Add Player</a> |

    <button type="button" (click)="toggleEditing()">
      {{ editGuard.guardEnabled() ? 'Unlock Editing' : 'Lock Editing' }}
    </button>

    @if (loadingService.isLoading()) {
      <span role="status" aria-live="polite">
        | Loading...
      </span>
    }
  </nav>
</header>

<hr>

@if (errorService.error(); as message) {
  <div
    role="alert"
    style="padding: 12px; border: 1px solid red; margin-bottom: 15px;"
  >
    <strong>Error:</strong> {{ message }}

    <button type="button" (click)="dismissError()">
      Dismiss
    </button>
  </div>
}

<router-outlet />
