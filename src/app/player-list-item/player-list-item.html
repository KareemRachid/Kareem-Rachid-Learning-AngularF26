
<div class="player-card">
  <h2>{{ player().strPlayer }}</h2>

  <p>Number: {{ player().strNumber || 'N/A' }}</p>

  @if (player().strThumb) {
    <img
      [src]="player().strThumb"
      [alt]="player().strPlayer"
      class="player-image"
    >
  }

  <p>Team: {{ player().strTeam }}</p>
  <p>Position: {{ player().strPosition || 'Unknown' }}</p>
  <p>Nationality: {{ player().strNationality || 'Not provided' }}</p>

  <div class="player-actions">
    <a [routerLink]="['/players', player().idPlayer]">
      View Details
    </a>

    <a [routerLink]="['/players/edit', player().idPlayer]">
      Edit Player
    </a>

    <button type="button" (click)="playerClicked()">
      Remove Player
    </button>
  </div>
</div>
