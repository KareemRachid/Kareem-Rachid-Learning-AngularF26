<h2>Player Details</h2>

@if (selectedPlayer(); as player) {
  <div class="player-card">
    <h3>{{ player.name }}</h3>

    <img
      [src]="player.imageUrl"
      [alt]="player.name"
      class="player-image"
    >

    <p>Number: {{ player.number }}</p>
    <p>Position: {{ player.position }}</p>
    <p>Team: {{ player.team }}</p>
    <p>Nationality: {{ player.nationality || 'Not provided' }}</p>
  </div>
} @else {
  <p>Player not found.</p>
}

<a routerLink="/players">Back to Players</a>
